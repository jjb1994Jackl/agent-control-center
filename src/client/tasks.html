<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>任务中心 · Agent Control Center</title>
    <link rel="icon" href="/assets/logo/favicon.svg" />
    <script type="module" src="/tasks.ts"></script>
  </head>
  <body>
    <header>
      <div class="wrap bar">
        <div class="brand">
          <img src="/assets/logo/logo-64.png" width="32" height="32" alt="" />Agent Control Center
        </div>
        <nav>
          <a id="nav-all" href="/tasks.html" aria-current="page">全部任务</a>
          <a id="nav-grok" href="/tasks.html?agent=grok">Grok Bot</a>
          <a href="/">会话工作台</a>
        </nav>
        <span class="local">本机工作区</span>
      </div>
    </header>
    <main class="wrap">
      <div class="heading">
        <h1 id="board-title">任务中心</h1>
        <button id="new" class="primary"><i data-lucide="plus"></i>新建任务</button>
      </div>
      <div class="counts">
        <div>全部任务<strong id="total">0</strong></div>
        <div>执行中<strong id="busy">0</strong></div>
        <div>待处理<strong id="attention">0</strong></div>
        <div>已完成<strong id="done">0</strong></div>
      </div>
      <section class="usage" aria-labelledby="usage-heading">
        <div class="toolbar">
          <h2 id="usage-heading">Agent 额度</h2>
          <button id="usage-refresh" class="icon" title="刷新额度" aria-label="刷新额度">
            <i data-lucide="refresh-cw"></i>
          </button>
        </div>
        <div id="usage-grid" class="usage-grid" aria-live="polite">正在读取额度…</div>
        <p id="usage-error" class="muted" role="status" hidden></p>
      </section>
      <div class="toolbar">
        <h2>派单记录</h2>
        <select id="filter" aria-label="按状态筛选">
          <option value="all">全部状态</option>
          <option value="busy">执行中</option>
          <option value="attention">待处理</option>
          <option value="completed">已完成</option>
          <option value="accepted">Grok 已受理</option></select
        ><button id="refresh" class="icon" aria-label="刷新任务" title="刷新任务">
          <i data-lucide="refresh-cw"></i>
        </button>
      </div>
      <p id="error" role="alert" hidden></p>
      <p id="grok-sync" class="muted sync-note" role="status" hidden></p>
      <div class="table">
        <div class="row labels">
          <span>任务 / 最新回复</span><span>Agent / 项目</span><span>状态</span><span>更新时间</span>
        </div>
        <div id="rows"></div>
      </div>
    </main>
    <dialog id="compose">
      <form id="dispatch">
        <div class="dialog-head">
          <h2>新建任务</h2>
          <button type="button" class="icon" id="close" title="关闭" aria-label="关闭">
            <i data-lucide="x"></i>
          </button>
        </div>
        <label>执行 Agent<select id="engine" required></select></label
        ><label id="project-label"
          >项目<input id="project" list="projects" placeholder="选择项目或填写本机目录" /><datalist
            id="projects"
          ></datalist
        ></label>
        <label id="session-label">会话<select id="session"></select></label>
        <p id="grok-note" hidden>交给主 Grok Bot。回传到达后会显示在这条任务下。</p>
        <label>任务内容<textarea id="prompt" rows="5" maxlength="32000" required></textarea></label>
        <p id="compose-error" role="alert" hidden></p>
        <footer>
          <button id="send" class="primary" type="submit"><i data-lucide="send"></i>下发任务</button>
        </footer>
      </form>
    </dialog>
    <dialog id="quota-dialog">
      <div class="dialog-head">
        <h2 id="quota-title">额度详情</h2>
        <button class="icon" id="quota-close" title="关闭" aria-label="关闭">
          <i data-lucide="x"></i>
        </button>
      </div>
      <dl id="quota-fields"></dl>
      <p id="quota-source" class="muted"></p>
    </dialog>
    <dialog id="detail">
      <div class="dialog-head">
        <h2>任务详情</h2>
        <button class="icon" id="detail-close" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
      </div>
      <dl id="detail-fields"></dl>
      <footer><a id="chat" class="primary">打开原会话</a></footer>
    </dialog>
  </body>
</html>
