name: Bug report
description: Something does not work, or stopped working after a desktop app update
labels: [bug]
body:
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Codex, Claude, Antigravity, All / not agent-specific]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Desktop app version, macOS version, Node.js version
      placeholder: Claude 1.2.3, macOS 15.1, Node 22.16
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what the page showed, and what the desktop app showed
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Server output
      description: Terminal output around that moment (AX_TRACE=1 npm start for Accessibility problems). Remove anything private; do not attach screenshots of real chats.
      render: text
